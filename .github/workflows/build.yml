name: Java Application Build and Kubernetes Deploy

on:
  push:
    branches:
      - main


jobs:
  build-and-deploy:
    runs-on: [self-hosted, Linux, X64, myrunner]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Maven Clean Package
        run: mvn clean package

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Build
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/url-shortener-springboot-maven:v1 .
      - name: Docker Push
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/url-shortener-springboot-maven:v1
        
      - name: Configure Kubernetes kubeconfig
        env:
        
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          set -e
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$KUBE_CONFIG_DATA" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context
          kubectl get nodes

      - name: Deploy Kubernetes YAML files
        run: |
          kubectl apply -f deployment.yml
          kubectl apply -f service.yml

     
